<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ma Livrothèque</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font:14px system-ui,sans-serif;margin:0;color:#222;background:#f4f1ea}
header{background:#5b3a29;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 12px 0 0}
header input[type=search]{padding:6px 10px;border:0;border-radius:4px;min-width:240px}
button{padding:6px 12px;border:0;border-radius:4px;background:#d9b382;color:#2b1a10;cursor:pointer;font:inherit}
button:hover{background:#e8c796}button.sec{background:#eee}button.danger{background:#e57373;color:#fff}
header label{font-size:13px}
#info{margin-left:auto;font-size:13px;opacity:.9}
main{padding:12px 16px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #e6e0d4;text-align:left;vertical-align:middle}
th{background:#ece5d6;cursor:pointer;position:sticky;top:52px;user-select:none;white-space:nowrap}
tr:hover td{background:#faf5ea}
td.r{max-width:380px;color:#555;font-size:12px}
.tag{display:inline-block;background:#e4eed8;border-radius:10px;padding:0 7px;font-size:12px}
.muted{color:#999}
dialog{border:0;border-radius:8px;padding:18px;width:min(760px,95vw);box-shadow:0 8px 40px #0006;max-height:92vh;overflow:auto}
dialog::backdrop{background:#0006}
.grid{display:grid;grid-template-columns:140px 1fr;gap:8px 10px;align-items:start}
.grid input,.grid textarea{width:100%;padding:6px;border:1px solid #bbb;border-radius:4px;font:inherit}
textarea{min-height:110px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.cand{display:flex;gap:10px;padding:8px;border:1px solid #ddd;border-radius:6px;margin:6px 0;cursor:pointer;background:#fff}
.cand:hover{background:#fff6e0}.cand img{width:48px;height:70px;object-fit:cover;background:#eee}
.cand small{color:#666}
#prog{position:fixed;bottom:0;left:0;right:0;background:#333;color:#fff;padding:8px 16px;display:none;z-index:9}
fieldset{border:1px solid #d8cfbd;border-radius:6px;margin:10px 0}legend{font-weight:600;padding:0 6px}
.cvl{height:150px;width:auto;border-radius:3px;box-shadow:0 2px 8px #0005}
.warn{color:#c77700;font-weight:700}
.cv{height:56px;width:auto;display:block;margin:0 auto;border-radius:2px;box-shadow:0 1px 3px #0004}
.cv:not([src]){width:38px;background:#eee}
table{table-layout:fixed;min-width:1290px}
tbody tr[data-i]{height:64px}
tbody td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px}
th{overflow:hidden;text-overflow:ellipsis}
tr.grp td{background:#d9c3a0;font-weight:600;cursor:pointer;height:34px;padding:4px 10px;color:#3b2616}
tr.grp:hover td{background:#cfb48b}
tr.grp small{font-weight:400;opacity:.7;margin-left:6px}
.rs{cursor:pointer;font-size:18px;text-align:center}
#ov{position:fixed;display:none;z-index:20;max-width:440px;max-height:50vh;overflow:auto;background:#fffdf6;border:1px solid #c9b78f;border-radius:8px;box-shadow:0 8px 30px #0005;padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.45}
#ov b{display:block;margin-bottom:6px}
#fMsg{min-height:1.2em;font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<header>
  <h1>📚 Ma Livrothèque</h1>
  <input type="search" id="q" placeholder="Rechercher (auteur, titre, résumé, ISBN…)">
  <label><input type="checkbox" id="fNoIsbn"> sans ISBN</label>

<dialog id="dlgV">

  <div class="row"><button id="vOk" class="sec" style="display:none">✓ Marquer comme vérifié</button><button id="vEdit">✎ Modifier</button><button id="vClose" class="sec">Fermer</button></div>

  <h3>Résultats en ligne</h3>
  <div class="grid" style="grid-template-columns:90px 1fr 90px 1fr">
    <label>ISBN</label><input id="cIsbn"><label></label><span></span>
    <label>Titre</label><input id="cTitre"><label>Auteur</label><input id="cAuteur">
  </div>
  <div class="row" style="margin-top:8px"><button id="cGo">Rechercher</button></div>
  <div id="cList"></div>
  <div class="row"><label style="margin-right:auto"><input type="checkbox" id="cOver"> écraser les champs déjà remplis</label><button id="cClose" class="sec">Fermer</button></div>

  <h3>Synchronisation GitHub</h3>
  <fieldset><legend>1. Accès au dépôt</legend>
    <div class="grid">
      <label>Dépôt</label><input id="sRepo" placeholder="proprietaire/nom">

      <label>UUID</label><input id="sLib" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" spellcheck="false">
    </div>
    <div class="row"><button id="sOpen">Ouvrir</button></div>
  </fieldset>
  <fieldset><legend>3. Créer une nouvelle bibliothèque</legend>
    <div class="grid">
      <label>Nom</label><input id="nName" placeholder="Ma bibliothèque">

      <label>Propriétaire</label><input id="nOwner">

    <div class="row"><button id="sCreate" class="sec">+ Créer (nouvel UUID)</button></div>
  </fieldset>
  <fieldset id="curBox"><legend>Bibliothèque ouverte</legend>
    <div class="grid">
      <label>UUID</label><code id="sCur" style="word-break:break-all"></code>
      <label>Nom</label><input id="sName">
      <label>Description</label><input id="sDesc">
      <label>Propriétaire</label><input id="sOwner">
    </div>
    <div class="row"><button id="sCopy" class="sec">Copier l'UUID</button><button id="sMeta" class="sec">Enregistrer les infos</button></div>
  </fieldset>
  <p id="sMsg" style="min-height:1.2em"></p>
  <div class="row"><button id="sClose" class="sec">Fermer</button></div>
</dialog>
<div id="prog"></div>

<script>
/* ---------- Règles de nommage : auteur "NOM Prénom", titre en casse typographique française ---------- */
const TX=(()=>{
const strip = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
const key = (s) => strip(s).toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[^a-z0-9]+/g, " ").trim();
const letters = (s) => s.replace(/[^A-Za-zÀ-ÿ]/g, "");
const mostlyUpper = (s) => { const l = letters(s); if (l.length < 2) return false; return (l.match(/[A-ZÀ-ÖØ-Þ]/g) || []).length / l.length >= 0.6; };

const PARTICLES = new Set(["de", "du", "des", "la", "le", "les", "van", "von", "der", "den", "di", "da", "del", "d'", "l'", "el", "al", "ben", "bin"]);
const FIRST = Object.fromEntries("Françoise André Éric Loïc José Michèle Raphaële Frédéric Hélène Émile Régine Agnès Thérèse Gérard Jérôme Stéphane Céline Élisabeth Évelyne Geneviève Mélanie Sébastien Christèle Adèle Amélie Anaïs Noël Noémie Joël Renée Zoé Léa Léon Élodie Édith Hervé Cécile Stéphanie Véronique Jérémie Maïté Raphaël Inès Gwenaëlle Chloé Clémence Éléonore Eugénie Félix Gaël Gaëlle Désirée Valérie Aurélie Cédric Clément Médéric Joséphine Honoré Albéric Frédérique Ghislaine Sylvère Rémy Rémi Léonie Mathilde Étienne Aimé Aïcha Zoë Séverine Estelle Ségolène Lénaïg Maëlle Loïs Anaëlle Océane Yaël Zélie Zéphyrine".split(" ").map((n) => [n.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase(), n]));
const cap = (w) => w.split(/(-|')/).map((p) => { if (p === "-" || p === "'" || p === "") return p; const k = p.toUpperCase(); return FIRST[k] || p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }).join("");

/** "DEFORGES REGINE" / "Guillaume Musso" / "Arces Amicie d'" -> "NOM Prénom" (casse seulement, sans accents) */
function authorCase(raw) {
  const s = String(raw || "").replace(/\s+/g, " ").trim();
  if (!s) return s;
  const t = s.split(" ");
  // particules finales ("BURON NICOLE DE") restent en minuscules à la fin
  const tail = [];
  while (t.length > 2 && PARTICLES.has(t[t.length - 1].toLowerCase())) tail.unshift(t.pop().toLowerCase());
  // particules initiales font partie du nom ("DE ROSNAY TATIANA")
  let i = 0; const nom = [];
  while (i < t.length - 1 && PARTICLES.has(t[i].toLowerCase())) nom.push(t[i++].toUpperCase());
  nom.push((t[i++] || "").toUpperCase());
  const prenom = t.slice(i).map(cap);
  return [nom.join(" "), prenom.join(" "), ...tail].filter(Boolean).join(" ");
}

/** "Deforges, Régine (1935-2014). Auteur du texte" -> "DEFORGES Régine" */
function bnfAuthor(c) {
  const m = String(c || "").replace(/\s*\(.*$/, "").replace(/\.\s.*$/, "").trim();
  const [nom, ...pre] = m.split(",").map((x) => x.trim());
  if (!nom) return "";
  return [nom.toUpperCase(), pre.join(" ")].filter(Boolean).join(" ");
}

/** casse typographique française d'un titre (sans accents ajoutés) */
function titleCase(raw) {
  let s = String(raw || "").replace(/\s+/g, " ").trim();
  const m = /^(\([^)]*\)\s*)/.exec(s); const prefix = m ? m[1] : ""; s = s.slice(prefix.length);
  if (mostlyUpper(s)) {
    s = s.toLowerCase();
    s = s.replace(/\b(i{1,3}|iv|vi{0,3}|ix|xi{0,3})\b(?=\s*$|\s*[:,)])/g, (x) => x.toUpperCase()); // chiffres romains en fin
  }
  s = s.replace(/^a (?=(la|l'|le|les|mon|ma|ton|ta|son|sa|nos|vos|leurs|tout|toute|tous|toutes|bientôt|demain|plus|moi)\b)/i, "À ");
  s = s.replace(/^([^\p{L}\p{N}]*)(\p{Ll})/u, (_, p, c) => p + c.toUpperCase());
  s = s.replace(/\s+([,.])/g, "$1").replace(/([,.;:!?])(?=[^\s\d"')\]»,.!?;:])/g, "$1 ").replace(/\s*([;:!?])/g, " $1");
  s = s.replace(/\s+/g, " ").trim();
  return prefix + s;
}

/** nombre de titres de série à retirer avant recherche : "(3) ", "2 ", "A2 - ", "2C - " */
const searchTitle = (t) => String(t || "").replace(/^\s*\([^)]*\)\s*/, "").replace(/^\s*[A-Za-z]?\d[A-Za-z]?\s*[-–]?\s+(?=\S)/, "").replace(/\s*\btome\s*\d+\b.*$/i, "").trim();

const dc = (xml, tag) => [...xml.matchAll(new RegExp(`<dc:${tag}>([^<]*)</dc:${tag}>`, "g"))].map((m) => m[1].replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&apos;|&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">"));
async function bnfSearch(title, author) {
  const w = (s) => key(s).split(" ").filter((x) => x.length > 1);
  const tw = w(title).slice(0, 6).join(" "), aw = w(author).slice(0, 2).join(" ");
  if (!tw) return [];
  const q = `bib.title all "${tw}"` + (aw ? ` and bib.author all "${aw}"` : "");
  const url = `https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=${encodeURIComponent(q)}&recordSchema=dublincore&maximumRecords=20`;
  for (let k = 0; k < 3; k++) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(25000) });
      if (!r.ok) throw new Error(r.status);
      const x = await r.text();
      return x.split("<srw:record>").slice(1).map((rec) => ({ title: dc(rec, "title")[0] || "", creator: dc(rec, "creator")[0] || "" }));
    } catch { await new Promise((r) => setTimeout(r, 800 * (k + 1))); }
  }
  return null;
}
/** titre principal d'une notice BnF : avant " / " puis avant " : " */
const bnfMain = (t) => t.split(" / ")[0].split(" : ")[0].replace(/\s*\[[^\]]*\]\s*/g, " ").replace(/\.\s*\[?\d+\]?\s*$/, "").trim();

const caps = (s) => (s.match(/[A-ZÀ-Þ]/g) || []).length;
const top = (cnt) => Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || caps(a) - caps(b))[0] || null;
/** titre BnF le plus fréquent parmi les notices dont le titre principal correspond (accents/casse ignorés) */
function pickTitle(cands, core) {
  const cnt = {};
  for (const c of cands) if (key(c.t) === key(core)) cnt[c.t] = (cnt[c.t] || 0) + 1;
  return top(cnt);
}
const tokens = (s) => key(s).split(" ").filter(Boolean).sort().join(" ");
/** auteur BnF "NOM Prénom" dont les mots (sans accents) sont exactement ceux de l'auteur saisi */
function pickAuthor(cands, db) {
  const want = tokens(db), cnt = {};
  for (const c of cands) { const a = bnfAuthor(c.c); if (a && tokens(a) === want) cnt[a] = (cnt[a] || 0) + 1; }
  return top(cnt);
}
/** remet le préfixe de série "(1) " / "2 - " et le suffixe " tome 3" autour du titre BnF */
function rebuildTitle(original, core, picked) {
  const i = original.toLowerCase().indexOf(core.toLowerCase());
  if (i < 0) return picked;
  const prefix = original.slice(0, i), suffix = original.slice(i + core.length);
  return prefix + picked.replace(/^\p{Ll}/u, (c) => c.toUpperCase()) + suffix.toLowerCase();
}

return {key,strip,mostlyUpper,authorCase,bnfAuthor,titleCase,searchTitle,bnfSearch,bnfMain,pickTitle,pickAuthor,rebuildTitle};
})();
const coverG=b=>b.isbn?`https://books.google.com/books/content?vid=ISBN${b.isbn}&printsec=frontcover&img=1&zoom=1`:"";
/* ordre : fichier du dépôt GitHub (chargé à part) > URL enregistrée > Open Library > Google Books */
const coverQ=(b,s)=>[b.couverture,b.isbn&&`https://covers.openlibrary.org/b/isbn/${b.isbn}-${s}.jpg?default=false`,coverG(b)].filter(Boolean);
const coverImg=(b,s,cls="cv")=>{const q=coverQ(b,s);return q.length?`<img class="${cls}" referrerpolicy="no-referrer" data-isbn="${esc(b.isbn||"")}" data-q="${esc(JSON.stringify(q))}" onerror="covErr(this)" onload="covOk(this)">`:""};
function covErr(i){const q=JSON.parse(i.dataset.q||"[]"),n=q.shift();if(n){i.dataset.q=JSON.stringify(q);i.src=n}else i.style.display="none"}
function covOk(i){if(i.src.includes("books.google.com")&&i.naturalWidth===128&&i.naturalHeight===170)i.style.display="none"} /* l'image "non disponible" de Google fait 128x170 */
const coverCache=new Map();
function repoCover(isbn){
  const c=cfg();if(!isbn||!lib()||!c.repo||!c.token)return Promise.resolve(null);
  const key=lib()+"/"+isbn;if(coverCache.has(key))return coverCache.get(key);
  const p=(async()=>{try{
    const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/libraries/${lib()}-covers/${isbn}.jpg?ref=${encodeURIComponent(c.branch)}`,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github.raw+json"}});
    return r.ok?URL.createObjectURL(await r.blob()):null}catch(e){return null}})();
  coverCache.set(key,p);return p;
}
async function loadCover(i){const u=await repoCover(i.dataset.isbn);if(u)i.src=u;else covErr(i)}
const coverObs=typeof IntersectionObserver==="function"?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){coverObs.unobserve(e.target);loadCover(e.target)}}),{rootMargin:"200px"}):null;
const hydrateCovers=root=>root.querySelectorAll("img[data-isbn]").forEach(i=>coverObs?coverObs.observe(i):loadCover(i));
const COLS=[["auteur","Auteur"],["titre","Titre"],["date_lecture","Lu le"],["nb_pages","Pages"],["localisation","Localisation"],["resume","Résumé"],["isbn","ISBN"],["date_achat","Acheté le"],["date_entree","Entré le"],["couverture","Pochette (URL)"],["a_verifier","À vérifier"]];
const KEY="livrotheque.v1", SK="livrotheque.sync.";
const lib=()=>localStorage.getItem(SK+"lib")||"";
const ck=()=>KEY+"."+(lib()||"local");
let books=JSON.parse(localStorage.getItem(ck())||"[]"), sortKey="auteur", sortDir=1, cur=null;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(ck(),JSON.stringify(books))}catch(e){alert("Stockage du navigateur plein : exportez le CSV !")}localStorage.setItem(SK+lib()+".dirty","1");scheduleSync()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dkey=d=>{const m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(d||"");return m?m[3]+m[2]+m[1]:""};
const cleanIsbn=s=>(s||"").replace(/[^0-9Xx]/g,"").toUpperCase();

/* ---------- CSV (tabulations, guillemets non échappés, encodage mixte UTF-8 / Windows-1252) ---------- */
function decodeLine(bytes){try{return new TextDecoder("utf-8",{fatal:true}).decode(bytes)}catch(e){return new TextDecoder("windows-1252").decode(bytes)}}
function parseCsv(buf){
  const u=new Uint8Array(buf), lines=[]; let s=0;
  for(let i=0;i<=u.length;i++) if(i===u.length||u[i]===10){ if(i>s) lines.push(decodeLine(u.subarray(s,i)).replace(/\r$/,"")); s=i+1; }
  if(lines.length&&lines[0].charCodeAt(0)===0xFEFF) lines[0]=lines[0].slice(1);
  const head=lines.shift().split("\t").map(h=>h.replace(/^"|"$/g,"").trim());
  return lines.filter(l=>l.trim()).map(l=>{const c=l.split("\t").map(x=>x.replace(/^"|"$/g,""));const o={};
    COLS.forEach(([k])=>{const i=head.indexOf(k);o[k]=i>=0?(c[i]||""):""});o.isbn=cleanIsbn(o.isbn);return o});
}
function toCsv(){
  const f=v=>'"'+String(v??"").replace(/[\t\r\n]+/g," ")+'"';
  return "﻿"+[COLS.map(([k])=>f(k)).join("\t"),...books.map(b=>COLS.map(([k])=>f(b[k])).join("\t"))].join("\r\n");
}

/* ---------- Affichage ---------- */
const WIDTHS={auteur:"190px",titre:"310px",date_lecture:"100px",nb_pages:"70px",localisation:"150px",resume:"72px",isbn:"132px",date_achat:"100px",date_entree:"100px"};
const norm=s=>String(s||"").replace(/^\s*\([^)]*\)\s*/,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const letterOf=s=>{const c=norm(s).charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:"#"};
const expanded=new Set();
let letters=[];
function render(){
  const cols=COLS.filter(([k])=>k!=="couverture"&&k!=="a_verifier");
  $("thead").innerHTML='<th style="width:56px"></th>'+cols.map(([k,l])=>`<th data-k="${k}" style="width:${WIDTHS[k]||"auto"}">${l}${sortKey===k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("");
  const q=$("q").value.toLowerCase().trim();
  const filtering=!!q; // la recherche texte ouvre tout ; les cases à cocher laissent plier/déplier
  let list=books.map((b,i)=>[b,i]).filter(([b])=>
    (!q||COLS.some(([k])=>String(b[k]).toLowerCase().includes(q)))&&
    (!$("fNoIsbn").checked||!b.isbn)&&(!$("fNoRes").checked||!b.resume)&&(!$("fUnread").checked||!b.date_lecture)&&(!$("fCheck").checked||b.a_verifier));
  const val=b=>/^date_/.test(sortKey)?dkey(b[sortKey]):sortKey==="nb_pages"?(+b.nb_pages||0):/^(auteur|titre)$/.test(sortKey)?norm(b[sortKey]).toLowerCase():String(b[sortKey]).toLowerCase();
  list.sort((a,b)=>{const x=val(a[0]),y=val(b[0]);return (x<y?-1:x>y?1:0)*sortDir||String(a[0].titre).localeCompare(String(b[0].titre))});
  const grouped=/^(auteur|titre)$/.test(sortKey);
  const counts={};if(grouped)list.forEach(([b])=>{const l=letterOf(b[sortKey]);counts[l]=(counts[l]||0)+1});
  letters=Object.keys(counts);
  const row=([b,i])=>`<tr data-i="${i}"><td>${coverImg(b,"S")}</td>`+cols.map(([k])=>
    k==="resume"?(b.resume?`<td class="rs" title="Résumé : survolez ou cliquez">📝</td>`:'<td class="muted" style="text-align:center">–</td>'):

/* ---------- Recherche en ligne : Open Library + Google Books (aucune clé requise) ---------- */
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
async function olIsbn(isbn){
  const out=[];
  try{
    const d=(await jget(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`))["ISBN:"+isbn];
    if(d){
      let resume="";
      try{const e=await jget(`https://openlibrary.org/isbn/${isbn}.json`);const w=e.works?.[0]?.key;
        let desc=e.description;if(!desc&&w)desc=(await jget(`https://openlibrary.org${w}.json`)).description;
        resume=typeof desc==="object"?desc?.value||"":desc||"";}catch(e){}
      out.push({src:"Open Library",titre:[d.title,d.subtitle].filter(Boolean).join(" : "),auteur:(d.authors||[]).map(a=>a.name).join(", "),
        nb_pages:d.number_of_pages||"",isbn,resume,cover:d.cover?.medium||d.cover?.small||"",editeur:(d.publishers||[]).map(p=>p.name).join(", ")});
    }
  }catch(e){}
  return out;
}
function gbItem(v){const i=v.volumeInfo||{};
  const id=(i.industryIdentifiers||[]).find(x=>x.type==="ISBN_13")||(i.industryIdentifiers||[])[0];
  return {src:"Google Books",titre:[i.title,i.subtitle].filter(Boolean).join(" : "),auteur:(i.authors||[]).join(", "),nb_pages:i.pageCount||"",
    isbn:id?id.identifier:"",resume:i.description||"",cover:(i.imageLinks?.smallThumbnail||"").replace("http:","https:"),editeur:i.publisher||""}}
const gKey=()=>localStorage.getItem("livrotheque.gkey")||"";
$("bKey").onclick=()=>{const k=prompt("Clé API Google Books (laisser vide pour désactiver Google Books) :",gKey());if(k!==null){localStorage.setItem("livrotheque.gkey",k.trim());alert(k.trim()?"Clé enregistrée.":"Google Books désactivé.")}};
async function gbSearch(q){if(!gKey())return [];try{return ((await jget(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&langRestrict=fr&key=${encodeURIComponent(gKey())}`)).items||[]).map(gbItem)}catch(e){return []}}
async function olSearch(titre,auteur){
  try{const p=new URLSearchParams({fields:"title,author_name,isbn,number_of_pages_median,cover_i",limit:8});
    if(titre)p.set("title",titre);if(auteur)p.set("author",auteur);
    return ((await jget("https://openlibrary.org/search.json?"+p)).docs||[]).map(d=>({src:"Open Library",titre:d.title,auteur:(d.author_name||[]).join(", "),
      nb_pages:d.number_of_pages_median||"",isbn:(d.isbn||[]).find(x=>x.length===13)||(d.isbn||[])[0]||"",resume:"",cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg`:"",editeur:""}))}catch(e){return []}
}
async function lookup(isbn,titre,auteur){
  if(isbn){return [...await olIsbn(isbn),...await gbSearch("isbn:"+isbn)]}
  const t=titre.replace(/^\([^)]*\)\s*/,""); // retire le préfixe de tome "(3) "
  return [...await gbSearch(`intitle:${t}`+(auteur?`+inauthor:${auteur}`:"")),...await olSearch(t,auteur)];
}
function applyTo(target,c,over){
  for(const k of ["titre","auteur","nb_pages","isbn","resume"]) if(c[k]&&(over||!target[k])) target[k]=String(c[k]);
  if(c.cover&&(over||!target.couverture)) target.couverture=c.cover;
}

$("bAuto").onclick=async()=>{
  const todo=books.filter(b=>b.isbn&&(!b.resume||!b.nb_pages));

/* ---------- Synchronisation GitHub (dépôt privé, API Contents) ---------- */
const cfg=(id,kind)=>({repo:localStorage.getItem(SK+"repo")||"",token:localStorage.getItem(SK+"token")||"",path:"libraries/"+(id||lib())+(kind==="meta"?"-metadata.json":"-database.csv"),branch:localStorage.getItem(SK+"branch")||"main"});
const setStatus=(t,c)=>{$("sync").textContent=t;$("sync").style.color=c||"#fff"};
const b64enc=s=>{const u=new TextEncoder().encode(s);let r="";for(let i=0;i<u.length;i+=0x8000)r+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(r)};
const b64dec=s=>Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)).buffer;
async function gh(method,body,id,kind){
  const c=cfg(id,kind);
  const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${encodeURI(c.path)}`+(method==="GET"?`?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`:""),
    {method,headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},body:body&&JSON.stringify(body)});
  if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}
  return r.json();
}
async function pull(){
  if(!cfg().repo||!cfg().token||!lib())return;
  setStatus("☁ lecture…");
  try{
    const f=await gh("GET");
    if(f.sha===localStorage.getItem(SK+lib()+".sha")&&localStorage.getItem(ck())!==null){setStatus("☁ à jour");return}
    const dirty=localStorage.getItem(SK+lib()+".dirty")==="1";
    if(dirty&&!confirm("Des modifications locales non synchronisées existent ET le dépôt a changé.\nOK = garder la version du dépôt (perd les modifs locales)\nAnnuler = garder la version locale (écrase le dépôt au prochain enregistrement)")){
      localStorage.setItem(SK+lib()+".sha",f.sha);scheduleSync();return}
    books=parseCsv(b64dec(f.content));
    localStorage.setItem(ck(),JSON.stringify(books));localStorage.setItem(SK+lib()+".sha",f.sha);localStorage.setItem(SK+lib()+".dirty","0");
    render();setStatus("☁ synchronisé");
  }catch(e){
    if(e.status===404){setStatus("☁ fichier absent : il sera créé","#ffd");localStorage.removeItem(SK+lib()+".sha");if(books.length)scheduleSync()}
    else setStatus("☁ erreur de lecture ("+e.message+")","#f99");
  }
}
let syncTimer=null,syncing=false;
function scheduleSync(){
  if(!cfg().repo||!cfg().token||!lib())return;
  setStatus("☁ modifications à envoyer…","#ffd");
  clearTimeout(syncTimer);syncTimer=setTimeout(push,2500);
}
async function push(){
  if(syncing){scheduleSync();return}
  syncing=true;setStatus("☁ envoi…");
  try{
    const r=await gh("PUT",{message:`chore: update library (${books.length} books)`,content:b64enc(toCsv()),branch:cfg().branch,sha:localStorage.getItem(SK+lib()+".sha")||undefined});
    localStorage.setItem(SK+lib()+".sha",r.content.sha);localStorage.setItem(SK+lib()+".dirty","0");setStatus("☁ synchronisé");
  }catch(e){
    if(e.status===409||e.status===422){setStatus("☁ conflit : le dépôt a été modifié ailleurs","#f99");
      if(confirm("Le dépôt a été modifié depuis un autre appareil.\nOK = recharger la version du dépôt (perd vos modifs locales)\nAnnuler = ne rien faire (exportez le CSV pour garder vos modifs)")){localStorage.setItem(SK+lib()+".dirty","0");await pull()}}
    else setStatus("☁ erreur d'envoi ("+e.message+")","#f99");
  }finally{syncing=false}
}
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const emptyCsv=()=>"\ufeff"+COLS.map(([k])=>'"'+k+'"').join("\t")+"\r\n";
const sMsg=(t,bad)=>{$("sMsg").textContent=t;$("sMsg").style.color=bad?"#c33":"#285"};
const metaKey=id=>SK+id+".meta";
const getMeta=()=>{try{return JSON.parse(localStorage.getItem(metaKey(lib())))||{}}catch(e){return {}}};
const fillMeta=m=>{$("sName").value=m?.name||"";$("sDesc").value=m?.description||"";$("sOwner").value=m?.owner||""};
const metaJson=(p="s")=>JSON.stringify({name:$(p+"Name").value.trim(),description:$(p+"Desc").value.trim(),owner:$(p+"Owner").value.trim()},null,2)+"\n";
async function loadMeta(id){
  try{const f=await gh("GET",null,id,"meta");const m=JSON.parse(new TextDecoder().decode(b64dec(f.content)));localStorage.setItem(metaKey(id),JSON.stringify(m));return m}
  catch(e){return null}
}
const updateLabel=()=>{const m=getMeta();$("bSync").textContent="☁ "+(lib()?(m.name||lib().slice(0,8)+"…"):"Synchro");$("bSync").title=lib()?[m.description,m.owner&&"Propriétaire : "+m.owner,lib()].filter(Boolean).join("\n"):"Synchronisation avec un dépôt GitHub privé"};
async function flushCurrent(){clearTimeout(syncTimer);if(lib()&&localStorage.getItem(SK+lib()+".dirty")==="1")await push()}
function saveAccess(){
  const repo=$("sRepo").value.trim(),token=$("sToken").value.trim();
  if(!repo||!token){sMsg("Dépôt et jeton obligatoires.",1);return null}
  localStorage.setItem(SK+"repo",repo);localStorage.setItem(SK+"token",token);return true;
}
function useLib(id){
  localStorage.setItem(SK+"lib",id);
  books=JSON.parse(localStorage.getItem(ck())||"[]");render();updateLabel();
}
const refreshCur=()=>{$("curBox").style.display=lib()?"":"none";$("sCur").textContent=lib()};
$("bSync").onclick=()=>{$("sRepo").value=cfg().repo;$("sToken").value=cfg().token;$("sLib").value="";["nName","nDesc","nOwner"].forEach(i=>$(i).value="");fillMeta(lib()?getMeta():null);refreshCur();sMsg("");$("dlgS").showModal()};
$("sClose").onclick=()=>$("dlgS").close();
$("sCopy").onclick=()=>{navigator.clipboard?.writeText(lib());sMsg("UUID copié.")};
$("sOpen").onclick=async()=>{
  if(!saveAccess())return;
  const id=$("sLib").value.trim().toLowerCase();
  if(!UUID.test(id))return sMsg("UUID invalide.",1);
  sMsg("Vérification…");
  try{await gh("GET",null,id)}catch(e){return sMsg(e.status===404?"Aucune bibliothèque avec cet UUID.":"Erreur GitHub ("+e.message+")",1)}
  await flushCurrent();useLib(id);fillMeta(await loadMeta(id));updateLabel();await pull();$("dlgS").close();
};
$("sCreate").onclick=async()=>{
  if(!saveAccess())return;
  if(!$("nName").value.trim())return sMsg("Donnez un nom à la nouvelle bibliothèque.",1);
  const id=crypto.randomUUID(),meta=metaJson("n");sMsg("Création…");
  try{
    const r=await gh("PUT",{message:"chore: create library "+id,content:b64enc(emptyCsv()),branch:cfg().branch},id);
    await gh("PUT",{message:"chore: add library metadata "+id,content:b64enc(meta),branch:cfg().branch},id,"meta");
    await flushCurrent();useLib(id);
    localStorage.setItem(SK+id+".sha",r.content.sha);localStorage.setItem(SK+id+".dirty","0");
    localStorage.setItem(metaKey(id),meta);updateLabel();
    ["nName","nDesc","nOwner"].forEach(i=>$(i).value="");fillMeta(getMeta());refreshCur();setStatus("☁ synchronisé");
    sMsg("Bibliothèque créée et ouverte. Notez son UUID : il est indispensable pour la rouvrir sur un autre appareil.");
  }catch(e){sMsg("Création impossible ("+e.message+")",1)}
};
$("sMeta").onclick=async()=>{
  if(!lib())return sMsg("Ouvrez ou créez d'abord une bibliothèque.",1);
  if(!saveAccess())return;
  if(!$("sName").value.trim())return sMsg("Le nom est obligatoire.",1);
  sMsg("Enregistrement…");
  try{
    let sha;try{sha=(await gh("GET",null,lib(),"meta")).sha}catch(e){if(e.status!==404)throw e}
    await gh("PUT",{message:"chore: update library metadata "+lib(),content:b64enc(metaJson()),branch:cfg().branch,sha},lib(),"meta");
    localStorage.setItem(metaKey(lib()),metaJson());updateLabel();sMsg("Infos enregistrées.");
  }catch(e){sMsg("Erreur GitHub ("+e.message+")",1)}
};
window.addEventListener("beforeunload",e=>{if(localStorage.getItem(SK+lib()+".dirty")==="1"&&cfg().repo){e.preventDefault();e.returnValue=""}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&localStorage.getItem(SK+lib()+".dirty")!=="1")pull()});

render();
updateLabel();
pull();
if(!books.length)$("info").textContent="Cliquez sur « ☁ Synchro » pour ouvrir ou créer une bibliothèque";
</script>
</body>
</html>
